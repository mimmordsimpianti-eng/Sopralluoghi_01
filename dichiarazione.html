<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A4F57">
<meta name="robots" content="noindex,nofollow">
<title>Dichiarazione – RDS Impianti</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  body{background:#fff}
  .cl{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 40px}
  .cl .logo{display:block;max-width:220px;margin:6px auto 14px}
  .cl h1{font-size:19px;color:#4A4F57;margin:0 0 6px}
  .cl .intro{color:var(--muto);font-size:15px;margin-bottom:12px}
  .cl .grande-seg button{padding:16px 8px;font-size:17px}
  .cl .seg button.on.acc{background:var(--verde);border-color:var(--verde)}
  .cl .seg button.on.no{background:var(--rosso);border-color:var(--rosso)}
  .pp-testo{background:#F2F4F8;border:1px solid var(--bordo);border-radius:10px;padding:12px;font-size:15px;line-height:1.5;white-space:pre-wrap;margin:10px 0}
  canvas.firma{width:100%;height:190px;border:2px dashed #8a919c;border-radius:12px;background:#fff;touch-action:none;display:block}
  details{margin:10px 0}summary{font-weight:600;color:var(--blu);padding:6px 0}
  .chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px}
  .chk input{width:22px;height:22px;margin-top:2px;flex:none}
  .fin{text-align:center;padding:30px 6px}.fin .ok-box{margin-bottom:14px}
</style>
</head>
<body>
<div class="cl" id="cl"><div class="vuoto">Caricamento…</div></div>
<script src="config.js"></script>
<script src="pdf.js"></script>
<script src="dich.js"></script>
<script src="dichiarazione.js"></script>
</body>
</html>
